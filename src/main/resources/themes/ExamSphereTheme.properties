@baseTheme = dark

# ── Backgrounds ──────────────────────────────────────────────────────────────
@background          = #0F1117
@secondaryBackground = #161B22
@cardBackground      = #1C2333
@elevatedBackground  = #21293A

# ── Accent ───────────────────────────────────────────────────────────────────
@accentColor         = #6366F1
@accentHover         = #4F46E5
@accentSecondary     = #06B6D4

# ── Status ───────────────────────────────────────────────────────────────────
@success             = #22C55E
@warning             = #F59E0B
@danger              = #EF4444

# ── Text ─────────────────────────────────────────────────────────────────────
@foreground          = #F1F5F9
@mutedForeground     = #94A3B8
@subtleForeground    = #64748B

# ── Borders ──────────────────────────────────────────────────────────────────
@borderColor         = #2D3748
@focusBorderColor    = #6366F1

# ── FlatLaf tokens ───────────────────────────────────────────────────────────
[light]
# Not used — dark only
[dark]

# Window / panel
*.background            = @background
*.foreground            = @foreground

# Buttons
Button.background       = @accentColor
Button.foreground       = #FFFFFF
Button.focusedBackground= @accentHover
Button.hoverBackground  = @accentHover
Button.pressedBackground= #3730A3
Button.arc              = 10
Button.font             = Segoe UI bold 14

# Text fields
TextField.background    = @cardBackground
TextField.foreground    = @foreground
TextField.caretForeground = @accentColor
TextField.focusedBackground = @elevatedBackground
TextField.arc           = 8

PasswordField.background  = @cardBackground
PasswordField.foreground  = @foreground
PasswordField.caretForeground = @accentColor
PasswordField.arc         = 8

# Scroll pane
ScrollPane.background   = @background
ScrollBar.background    = @secondaryBackground
ScrollBar.thumb         = #2D3748
ScrollBar.thumbHover    = #374151
ScrollBar.thumbPressed  = @accentColor
ScrollBar.width         = 8

# Radio buttons
RadioButton.background  = transparent
RadioButton.foreground  = @foreground
RadioButton.icon.focusColor = @accentColor
RadioButton.icon.selectedColor = @accentColor
RadioButton.icon.borderColor = #4B5563

# Check boxes
CheckBox.background     = transparent
CheckBox.foreground     = @mutedForeground

# Panels
Panel.background        = @background

# Labels
Label.foreground        = @foreground

# Combo boxes
ComboBox.background     = @cardBackground
ComboBox.foreground     = @foreground
ComboBox.focusedBackground = @elevatedBackground

# Option panes / dialogs
OptionPane.background   = @cardBackground
OptionPane.foreground   = @foreground
OptionPane.messageForeground = @foreground

# Progress bar
ProgressBar.background  = @elevatedBackground
ProgressBar.foreground  = @accentColor
ProgressBar.arc         = 6
ProgressBar.horizontalSize = 6 6
